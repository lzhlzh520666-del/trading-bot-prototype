<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f1f5f9;color:#1f2937;height:100vh;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr;grid-template-columns:220px 1fr 460px;
  grid-template-areas:"topbar topbar topbar" "sidenav stage modal"}
body.all-on{grid-template-columns:220px 1fr;
  grid-template-areas:"topbar topbar" "sidenav stage"}
body.all-on .modal{display:none}
body.all-on .all-only{display:flex}

/* ====== 顶部横向 app bar ====== */
.topbar{grid-area:topbar;display:flex;align-items:center;gap:16px;padding:10px 22px;
  background:#0f172a;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:30}
.topbar .brand{font-weight:700;font-size:15px;margin-right:auto;white-space:nowrap}
.topbar .brand small{font-weight:400;color:#94a3b8;font-size:11px;margin-left:8px}

/* ====== 左侧垂直导航栏（可上下滚动） ====== */
.sidenav{grid-area:sidenav;background:#1e293b;color:#cbd5e1;display:flex;flex-direction:column;
  overflow:hidden;border-right:1px solid #0f172a}
.sidenav .nav-head{padding:14px 16px 8px;font-size:11px;color:#64748b;letter-spacing:.08em;
  text-transform:uppercase;border-bottom:1px solid #334155;flex:0 0 auto}
.sidenav .nav-scroll{flex:1 1 auto;overflow-y:auto;padding:8px 0}
.sidenav .nav-scroll::-webkit-scrollbar{width:6px}
.sidenav .nav-scroll::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
.snav-all{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;border:none;
  background:#0ea5e9;color:#fff;font-size:13px;font-weight:600;width:100%;text-align:left;
  margin:0 0 8px;border-radius:0;transition:.12s}
.snav-all:hover{background:#0284c7}
.snav-all.active{background:#0284c7}
.snav-all .icn{font-size:16px}
.snav{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;border:none;
  background:transparent;color:#cbd5e1;font-size:13px;width:100%;text-align:left;
  transition:background .12s;line-height:1.3}
.snav:hover{background:#334155;color:#fff}
.snav.active{background:#2563eb;color:#fff;font-weight:600}
.snav .ord{display:inline-block;width:22px;color:#64748b;font-family:ui-monospace,Consolas,monospace;
  font-size:11px;flex:0 0 auto;text-align:right}
.snav.active .ord{color:rgba(255,255,255,.75)}
.snav .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snav .mark{display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;flex:0 0 auto}

/* ====== 中间 stage ====== */
.stage{grid-area:stage;padding:24px;display:flex;align-items:flex-start;justify-content:center;
  overflow:auto;background:#f1f5f9;min-width:0}
.frame{position:relative;border-radius:24px;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.18);background:#0b1020;flex:0 0 auto}
/* img 用 cover+top 居中：393x853 正常图精确充满；异常图自动顶部对齐裁切 */
.frame img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;
  object-fit:cover;object-position:top center}
.badge{position:absolute;width:26px;height:26px;border-radius:50%;border:2px solid #fff;
  background:#16a34a;color:#fff;font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35);
  transition:transform .12s,background .12s;z-index:5}
.badge:hover{transform:scale(1.15)}
.badge.active{background:#dc2626;transform:scale(1.25);z-index:9}

/* ====== "全部页"网格（仅在 all-on 时显示） ====== */
.all-wrap{display:none;flex-direction:column;align-items:stretch;width:100%;height:100%;overflow:hidden}
.all-only{display:none}
.all-on .stage .frame-wrap{display:none}
.all-on .stage .all-wrap{display:flex}
.all-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  background:#fff;border-bottom:1px solid #e2e8f0;font-size:14px;color:#1f2937}
.all-head .cnt{color:#64748b;font-size:12px;margin-left:8px}
.all-grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:14px;padding:20px;overflow-y:auto;align-content:start}
.cell{background:#fff;border-radius:12px;padding:10px;cursor:pointer;transition:.15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.cell:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.cell img{width:100%;height:300px;object-fit:cover;object-position:top center;
  border-radius:6px;background:#0b1020}
.cell .nm{font-size:12px;color:#1f2937;font-weight:500;text-align:center;line-height:1.3}
.cell .ord{color:#94a3b8;font-size:11px;font-family:ui-monospace,Consolas,monospace}
.cell .ann-tag{font-size:10px;padding:1px 6px;border-radius:8px;background:#dcfce7;color:#16a34a}
.cell .noann-tag{font-size:10px;padding:1px 6px;border-radius:8px;background:#f1f5f9;color:#94a3b8}

/* ====== 右列描述弹窗（永远占位不遮挡 stage） ====== */
.modal{grid-area:modal;background:#fff;display:flex;flex-direction:column;
  border-left:1px solid #e2e8f0;min-width:0;overflow:hidden}
.modal.empty{align-items:center;justify-content:center;color:#94a3b8;font-size:13px;
  text-align:center;padding:24px;line-height:1.8}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  border-bottom:1px solid #e2e8f0;background:#0f172a;color:#fff;flex:0 0 auto}
.m-head .mt{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.m-head .mt .num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#16a34a;
  align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
.m-head .mt .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-close{border:none;background:transparent;color:#cbd5e1;font-size:20px;cursor:pointer;line-height:1;
  flex:0 0 auto}
.m-close:hover{color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px 8px;border-bottom:1px solid #eef2f7;
  flex:0 0 auto}
.tab{border:none;background:#eef2f7;color:#475569;padding:5px 10px;border-radius:18px;
  font-size:12px;cursor:pointer}
.tab.active{background:#2563eb;color:#fff}
.panes{flex:1 1 auto;overflow-y:auto;padding:14px 18px;min-height:0}
.panes section{display:none}
.panes section.on{display:block}
.sub-h{font-size:11px;font-weight:700;color:#2563eb;letter-spacing:.04em;margin:14px 0 4px;
  text-transform:uppercase}
.sub-h:first-child{margin-top:0}
.body{font-size:13px;line-height:1.75;color:#374151;white-space:normal}
.empty-msg{color:#94a3b8;font-size:12px;padding:6px 0}
.frame-wrap{display:flex;align-items:flex-start;justify-content:center;width:100%}
.no-desc{display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#94a3b8;font-size:14px;line-height:1.6;text-align:center;padding:20px;width:100%}
.no-desc b{color:#64748b;display:block;font-size:14px}
</style>

let cur = null;          // 当前画板 key（null = 全部页）
const modal = document.getElementById('modal');
const stage = document.getElementById('stage');
const sidenav = document.getElementById('sidenav');
const sidenavAll = document.getElementById('snav-all');

function renderSidenav(){
  const items = PAGES.map((p,i)=>{
    const mark = p.anns && p.anns.length ? '<span class="mark"></span>' : '';
    const isActive = cur===p.key;
    return `<button class="snav ${isActive?'active':''}" data-key="${p.key}" onclick="switchPage('${p.key}')">
      <span class="ord">${i+1}</span><span class="nm">${p.name}</span>${mark}
    </button>`;
  }).join('');
  sidenav.innerHTML = items;
}

function renderStage(p){
  const hasAnn = p.anns && p.anns.length;
  const badges = hasAnn ? p.anns.map(a=>
    `<button class="badge" style="left:${a.bx}px;top:${a.by}px" data-id="${a.n}" onclick="openAnn(${a.n})">${a.n}</button>`
  ).join('') : '';
  const frame = `<div class="frame-wrap"><div class="frame" style="width:${p.frame_w}px;height:${p.frame_h}px">
    <img src="${p.img}" alt="${p.name}">${badges}
  </div></div>`;
  const noDesc = `<div class="no-desc"><b>本画板暂无页面描述</b></div>`;
  return frame + (hasAnn ? '' : noDesc);
}

function switchPage(key){
  const p = PAGES.find(x=>x.key===key); if(!p) return;
  cur = key;
  document.body.classList.remove('all-on');
  renderSidenav();
  sidenavAll.classList.remove('active');
  stage.innerHTML = renderStage(p);
  // 默认弹出序号 1
  if(p.anns && p.anns.length) openAnn(p.anns[0].n); else closeAnn();
  // 滚动 sidenav 到当前项
  const activeBtn = sidenav.querySelector('.snav.active');
  if(activeBtn) activeBtn.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function showAll(){
  cur = null;
  document.body.classList.add('all-on');
  renderSidenav();
  sidenavAll.classList.add('active');
  const cells = PAGES.map((p,i)=>{
    const tag = (p.anns && p.anns.length)
      ? `<span class="ann-tag">有标注</span>`
      : `<span class="noann-tag">仅截图</span>`;
    return `<div class="cell" onclick="switchPage('${p.key}')">
      <img src="${p.img}" alt="${p.name}">
      <div class="ord">#${i+1}</div>
      <div class="nm">${p.name}</div>
      ${tag}
    </div>`;
  }).join('');
  stage.innerHTML = `<div class="all-wrap">
    <div class="all-head">📋 全部画板<span class="cnt">共 ${PAGES.length} 项 · 按 Figma 画板左→右顺序</span></div>
    <div class="all-grid">${cells}</div>
  </div>`;
  closeAnn();
}

const ORDER = [["page","页面内容"],["inter","交互说明"],["rule","业务规则"],["field","字段说明"],["todo","待确认"]];
const EMPTY = "—";
function esc(t){ return (t||"").replace(/\n/g,"<br>"); }
function fillOne(pane, text, label){
  if(!text || text===EMPTY) pane.innerHTML = '<p class="empty-msg">本序号暂无'+label+'标注</p>';
  else pane.innerHTML = '<div class="body">'+esc(text)+'</div>';
}
function openAnn(id){
  if(!cur) return;
  const p = PAGES.find(x=>x.key===cur); if(!p) return;
  const a = p.anns.find(x=>x.n===id); if(!a) return;
  document.querySelectorAll('.badge').forEach(b=>b.classList.toggle('active',+b.dataset.id===id));
  document.getElementById('m-num').textContent = a.n;
  document.getElementById('m-title').textContent = a.title;
  let all = "";
  ORDER.forEach(([k,label])=>{
    if(a[k] && a[k]!==EMPTY) all += '<div class="sub-h">'+label+'</div><div class="body">'+esc(a[k])+'</div>';
  });
  document.querySelector('#m-panes section[data-pane="all"]').innerHTML =
    all || '<p class="empty-msg">本序号暂无标注内容</p>';
  fillOne(document.querySelector('#m-panes section[data-pane="page"]'), a.page, "页面内容");
  fillOne(document.querySelector('#m-panes section[data-pane="inter"]'), a.inter, "交互说明");
  fillOne(document.querySelector('#m-panes section[data-pane="rule"]'), a.rule, "业务规则");
  fillOne(document.querySelector('#m-panes section[data-pane="field"]'), a.field, "字段说明");
  fillOne(document.querySelector('#m-panes section[data-pane="todo"]'), a.todo, "待确认");
  document.querySelectorAll('#m-tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.pane==='all'));
  document.querySelectorAll('#m-panes section').forEach(s=>s.classList.toggle('on', s.dataset.pane==='all'));
  modal.classList.remove('empty');
}
function closeAnn(){
  document.querySelectorAll('.badge').forEach(b=>b.classList.remove('active'));
  modal.classList.add('empty');
  document.getElementById('m-num').textContent = '—';
  document.getElementById('m-title').textContent = '点击画板内徽标查看标注';
  document.querySelectorAll('#m-panes section').forEach(s=>s.innerHTML = '');
}
document.querySelectorAll('#m-tabs .tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('#m-tabs .tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('#m-panes section').forEach(s=>s.classList.remove('on'));
    t.classList.add('active');
    document.querySelector('#m-panes section[data-pane="'+t.dataset.pane+'"]').classList.add('on');
  };
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAnn(); });

// 初始：默认进入第 1 个画板
switchPage(PAGES[0].key);
</script>
</body>
